<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<link rel="icon" href="%sveltekit.assets%/favicon.png" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />

	<!-- Primary Meta Tags -->
	<title>Rivara Wallet - Secure Multi-Chain Crypto Wallet</title>
	<meta name="title" content="Rivara Wallet - Secure Multi-Chain Crypto Wallet" />
	<meta name="description"
		content="Non-custodial multi-chain cryptocurrency wallet supporting Bitcoin, Ethereum, Dogecoin, Litecoin, Solana, Tron, and Polygon. Your keys, your crypto." />
	<meta name="keywords"
		content="crypto wallet, bitcoin wallet, ethereum wallet, dogecoin wallet, multi-chain wallet, non-custodial wallet, web3 wallet, cryptocurrency, blockchain" />
	<meta name="author" content="Rivara" />
	<meta name="robots" content="index, follow" />

	<!-- Open Graph / Facebook -->
	<meta property="og:type" content="website" />
	<meta property="og:url" content="https://rivarawallet.xyz/" />
	<meta property="og:title" content="Rivara Wallet - Secure Multi-Chain Crypto Wallet" />
	<meta property="og:description"
		content="Non-custodial multi-chain cryptocurrency wallet supporting Bitcoin, Ethereum, Dogecoin, Litecoin, Solana, Tron, and Polygon. Your keys, your crypto." />
	<meta property="og:site_name" content="Rivara Wallet" />

	<!-- Twitter -->
	<meta property="twitter:card" content="summary" />
	<meta property="twitter:url" content="https://rivarawallet.xyz/" />
	<meta property="twitter:title" content="Rivara Wallet - Secure Multi-Chain Crypto Wallet" />
	<meta property="twitter:description"
		content="Non-custodial multi-chain cryptocurrency wallet supporting Bitcoin, Ethereum, Dogecoin, Litecoin, Solana, Tron, and Polygon. Your keys, your crypto." />

	<!-- Additional Meta Tags -->
	<meta name="theme-color" content="#0891b2" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
	<meta name="apple-mobile-web-app-title" content="Rivara" />

	<!-- PWA Manifest -->
	<link rel="manifest" href="%sveltekit.assets%/manifest.json" />

	<!-- Security Headers -->
	<meta http-equiv="X-Content-Type-Options" content="nosniff" />
	<meta http-equiv="X-Frame-Options" content="DENY" />
	<meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />

	<!-- Structured Data (JSON-LD) -->
	<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@type": "SoftwareApplication",
			"name": "Rivara Wallet",
			"applicationCategory": "FinanceApplication",
			"operatingSystem": "Web Browser",
			"offers": {
				"@type": "Offer",
				"price": "0",
				"priceCurrency": "USD"
			},
			"description": "Non-custodial multi-chain cryptocurrency wallet supporting Bitcoin, Ethereum, Dogecoin, Litecoin, Solana, Tron, and Polygon.",
			"featureList": [
				"Multi-chain support",
				"Non-custodial",
				"Encrypted local storage",
				"Built-in exchange",
				"Portfolio tracking"
			]
		}
		</script>

	<!-- Crypto libraries served locally (copied from node_modules by scripts/copy-libs.js) -->
	<script src="%sveltekit.assets%/libs/chart.umd.min.js"></script>
	<script src="%sveltekit.assets%/libs/ethers.umd.min.js"></script>
	<script src="%sveltekit.assets%/libs/bitcoinjs.min.js"></script>
	<script src="%sveltekit.assets%/libs/TronWeb.js"></script>
	<script src="%sveltekit.assets%/libs/nacl-fast.min.js"></script>
	<script src="%sveltekit.assets%/libs/solana-web3.iife.min.js"></script>

	<!-- Load wallet utility scripts from static folder -->
	<script src="/ed25519-derive.js"></script>

	<script>
		// Setup crypto libraries (same as old desktop app)
		window.addEventListener('load', () => {
			if (window.ethers && window.bitcoinjs) {
				window.cryptoLibs = {
					ethers: window.ethers,
					bitcoin: window.bitcoinjs,
					tron: window.TronWeb
				};
				console.log('✅ Crypto libraries loaded from CDN');
			}

			// Register Secure Service Worker for key isolation
			if ('serviceWorker' in navigator) {
				navigator.serviceWorker.register('/secure-worker.js')
					.then(registration => {
						console.log('✅ Secure Service Worker registered:', registration.scope);
					})
					.catch(error => {
						console.error('❌ Service Worker registration failed:', error);
					});
			}
		});

		// SECURITY: Enhanced logging and monitoring
		(function() {
			const devMode = localStorage.getItem('rivara_devmode') === 'true';
			
			// Security status logger
			console.log('%c🔒 Rivara Wallet Security Status', 'color: #0891b2; font-size: 14px; font-weight: bold;');
			console.log('%c├─ Service Worker: ' + ('serviceWorker' in navigator ? '✓ Active' : '✗ Not Available'), 'color: #10b981;');
			console.log('%c├─ Non-extractable Keys: ✓ Enabled', 'color: #10b981;');
			console.log('%c├─ Auto-lock: ✓ 5 minutes', 'color: #10b981;');
			console.log('%c├─ PBKDF2 Iterations: 600,000', 'color: #10b981;');
			console.log('%c└─ Dev Mode: ' + (devMode ? '✓ Enabled' : '✗ Disabled'), devMode ? 'color: #f59e0b;' : 'color: #6b7280;');
			
			if (!devMode) {
				console.log('%c\n⚠️  Security Notice', 'color: #f59e0b; font-size: 12px; font-weight: bold;');
				console.log('%cThis wallet uses Service Worker isolation. Private keys are stored in non-extractable CryptoKeys.', 'color: #9ca3af;');
				console.log('%cTo enable developer tools, go to Settings → Dev Mode.', 'color: #9ca3af;');
				
				// Monitor suspicious storage access (only from console/devtools, not app code)
				const originalGetItem = Storage.prototype.getItem;
				let accessCount = 0;
				const MAX_LEGITIMATE_ACCESS = 50; // App will access storage legitimately
				
				Storage.prototype.getItem = function(key) {
					// Only warn after many accesses (likely manual console usage)
					if (!devMode && (key === 'encryptedWallet' || key === 'duressSalt' || key === 'duressHash')) {
						accessCount++;
						if (accessCount > MAX_LEGITIMATE_ACCESS) {
							console.warn('🔐 Unusual storage access pattern detected:', key);
						}
					}
					return originalGetItem.call(this, key);
				};
			} else {
				console.log('%c\n🛠️  Developer Mode Active', 'color: #f59e0b; font-size: 12px; font-weight: bold;');
				console.log('%cFull console access enabled. Storage monitoring disabled.', 'color: #9ca3af;');
			}
		})();
	</script>

	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover" data-theme="dark" class="dark">
	<div style="display: contents">%sveltekit.body%</div>
	<script>
		// Initialize theme from localStorage before page renders
		(function() {
			const theme = localStorage.getItem('theme') || 'dark';
			document.body.setAttribute('data-theme', theme);
			document.documentElement.setAttribute('data-theme', theme);
			if (theme === 'dark') {
				document.documentElement.classList.add('dark');
			} else {
				document.documentElement.classList.remove('dark');
			}
		})();
	</script>
</body>

</html>
